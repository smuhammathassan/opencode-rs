name: CI

on:
  push:
    branches: [main, "audit-*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  audit-integrity:
    name: audit-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Node dependencies
        run: npm ci
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ''
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build production binaries and examples
        run: cargo build --workspace --examples
      - name: Execute 26 live reference-vs-Rust differential scenarios
        run: python3 scripts/run_differential.py
      - name: Verify audit integrity and cryptographic output hashes
        run: python3 scripts/verify-tui-audit.py

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ''
      - name: Clippy workspace check
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
      - name: Build workspace binaries
        run: cargo build --workspace
      - name: Run workspace tests
        run: cargo test --workspace --no-fail-fast -- --skip tui_
      - name: Run interactive PTY test suite
        if: runner.os != 'Windows'
        run: cargo test -p oc-tui --test interactive_pty -- --test-threads=1
