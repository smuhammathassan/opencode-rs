[workspace]
resolver = "2"
members = [
  "crates/oc-schema",
  "crates/oc-util",
  "crates/oc-config",
  "crates/oc-database",
  "crates/oc-core",
  "crates/oc-provider",
  "crates/oc-llm",
  "crates/oc-plugin",
  "crates/oc-mcp",
  "crates/oc-tool",
  "crates/oc-session",
  "crates/oc-session-runner",
  "crates/oc-acp",
  "crates/oc-server",
  "crates/oc-client",
  "crates/oc-tui",
  "crates/oc-command",
  "crates/oc-project",
  "crates/oc-sync",
  "crates/oc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/smuhammathassan/opencode-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
regex = "1"
rustls = { version = "0.23", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
directories = "5"
indexmap = { version = "2", features = ["serde"] }
toml = "0.8"
json5 = "0.4"
quick-js = "0.1"
